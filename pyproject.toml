[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chess"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["python-chess>=1.999", "PySide6>=6.5"]

[project.scripts]
ai-chess = "ai_chess.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_chess*"]
